services:
  bot:
    build: .
    image: planner-bot:latest
    container_name: planner-bot
    restart: unless-stopped
    environment:
      # Токен от @BotFather — обязателен; без него compose упадёт с понятной ошибкой
      BOT_TOKEN: ${BOT_TOKEN:?Установите BOT_TOKEN в .env или окружении}
      # Каталог данных внутри контейнера (совпадает с volume ниже)
      BOT_DATA_DIR: /app/data
      # Таймзона для "сегодня/завтра" (переопределяется в .env)
      BOT_TIMEZONE: ${BOT_TIMEZONE:-Asia/Novosibirsk}
      # Таймаут long polling, секунд
      POLL_TIMEOUT: ${POLL_TIMEOUT:-30}
    volumes:
      - bot-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  bot-data:
    name: planner-bot-data
