services:
  postgres:
    image: postgres:17-alpine
    container_name: planner-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-planner_bot}
      POSTGRES_USER: ${DB_USERNAME:-planner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Установите DB_PASSWORD в .env или окружении}
    ports:
      # 5432 хоста может быть занят другим проектом — наружу смотрим на 5433
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: planner-bot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pg-data:
    name: planner-bot-pgdata
  redis-data:
    name: planner-bot-redis-data
