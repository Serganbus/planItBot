; Supervisor-конфиг воркера очереди Telegram (Шаг 5).
;
; Установка (Linux):
;   sudo cp deploy/planner-bot-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Эквивалентный вариант для systemd (deploy без supervisor):
;
;   [Unit]
;   Description=Planner bot telegram queue worker
;   After=network.target redis.service postgresql.service
;
;   [Service]
;   User=www-data
;   Group=www-data
;   Restart=always
;   RestartSec=3
;   ExecStart=/usr/bin/php /var/www/planner-bot/artisan queue:work redis --queue=telegram --tries=3 --backoff=5 --sleep=3
;   TimeoutStopSec=15
;
;   [Install]
;   WantedBy=multi-user.target
;
; Назначение: queue:work только очереди `telegram`, 3 попытки
; (джоб дополнительно ограничивает backoff: 5/30/120 сек), автоперезапуск.

[program:planner-bot-worker]
command=php /var/www/planner-bot/artisan queue:work redis --queue=telegram --tries=3 --backoff=5 --sleep=3 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=15
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/planner-bot-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
